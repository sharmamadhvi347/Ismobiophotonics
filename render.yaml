services:
  - type: web
    name: pms-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    preDeployCommand: pnpm db:push
    startCommand: pnpm start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pms-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: WEB_ORIGIN
        value: '*'

databases:
  - name: pms-postgres
    plan: free
    databaseName: pms_prod
    user: pms_user
